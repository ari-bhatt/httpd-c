name: CI
on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential curl

      # Newer runner kernels use more mmap randomness than ThreadSanitizer supports.
      - name: Allow sanitizers on newer kernels
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Build (strict warnings, -Werror)
        run: make all

      - name: Unit tests
        run: make test

      - name: Smoke tests
        run: bash tests/smoke.sh

      - name: Smoke tests under ASan + UBSan
        run: make asan && bash tests/smoke.sh

      - name: Smoke tests under TSan
        run: make tsan && bash tests/smoke.sh

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t httpd-c .

      - name: Container smoke test
        run: |
          docker run -d --name web -p 8080:8080 httpd-c
          for i in $(seq 30); do curl -fsS http://localhost:8080/ >/dev/null && break; sleep 0.5; done
          curl -fsS http://localhost:8080/ | grep -q "It works"

      - name: Graceful stop (SIGTERM, must exit 0 well before the 10 s kill)
        run: |
          start=$(date +%s)
          docker stop web
          elapsed=$(( $(date +%s) - start ))
          code=$(docker inspect web --format '{{.State.ExitCode}}')
          echo "stopped in ${elapsed}s with exit code $code"
          docker logs web
          test "$code" -eq 0 && test "$elapsed" -lt 8
